# ============================================================
# Louder-ESP32-S3 - Media Player Configuration
# ============================================================
# ESP32 audio board with TAS5825M DAC (I2C+I2S) with built-in DSP
# Configured with Sendspin for synchronized multi-room audio
# Board-specific pinouts defined in substitutions
# Functional blocks imported from /packages
# ============================================================

substitutions:
  name: esphome-web-896908
  friendly_name: Louder-ESP32-S3
  task_stack_in_psram: "true" 

  # ===== Board-Specific Pinouts =====
  # I2S audio pins
  i2s_lrclk_pin: GPIO15
  i2s_bclk_pin: GPIO14
  i2s_dout_pin: GPIO16

  # TAS5805M
  tas58xx_variant: TAS5805M
  tas58xx_enable_pin: GPIO17
  i2c_sda_pin: GPIO8
  i2c_scl_pin: GPIO9

  # ===== DAC Overrides (optional) =====
  # tas58xx_dac_mode: PBTL 
  # tas58xx_mixer_mode: MONO
  # tas58xx_analog_gain: 0db
  # tas58xx_volume_max: 0dB
  # tas58xx_volume_min: -60dB
  # tas58xx_refresh_eq: AUTO
  
  # RGB LED
#  rgb_led_pin: GPIO21

  # IR Receiver
  #ir_rx_pin: GPIO07

  # SPI pins (for display)
  #spi_clk_pin: GPIO12
  #spi_mosi_pin: GPIO11
  #spi_miso_pin: GPIO13

  # Display control pins
  #display_cs_pin: GPIO47
  #display_dc_pin: GPIO38
  #display_reset_pin: GPIO48

  # Ethernet pins (if using ethernet instead of wifi)
  #eth_cs_pin: GPIO10
  #eth_interrupt_pin: GPIO6
  #eth_reset_pin: GPIO5

  #==================tmuWolverine Changes
  volume_led_pin: GPIO05

  #volume rotary encoder
  rotary_pin_a: GPIO10
  rotary_pin_b: GPIO12
  rotary_pin_button: GPIO6
  
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.5.0
  name_add_mac_suffix: false
  platformio_options:
    board_build.flash_mode: dio

esp32:
  variant: ESP32S3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      # Moves instructions and read only data from flash into PSRAM on boot.
      # Both enabled allows instructions to execute while a flash operation is in progress without needing to be placed in IRAM.
      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y" 

logger:
  level: INFO

api:

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

network:
  enable_ipv6: true

#==================tmuWolverine Changes
light:
  - platform: esp32_rmt_led_strip
    name: volumeLED
    rgb_order: GRB
    chipset: WS2812
    pin: ${volume_led_pin}
    num_leds: 5
    id: volumeled
    rmt_symbols: 48

    effects:
      - addressable_lambda:
          name: "Volume Display"
          update_interval: 50ms
          lambda: |-
            int leds = (int) ceil(id(current_volume) * 5.0f);

            for (int i = 0; i < 5; i++) {
              if (i < leds) {
                it[i] = Color(0, 255, 0);
              } else {
                it[i] = Color(0, 0, 0);
              }
            }

globals:
  - id: last_volume
    type: float
    initial_value: '-1.0'

script:
  - id: update_volume_leds
    then:
      - light.turn_on:
          id: volumeled
          effect: "Volume Display"

interval:
  - interval: 50ms
    then:
      - if:
          condition:
            lambda: |-
              return id(current_volume) != id(last_volume);
          then:
            - lambda: |-
                id(last_volume) = id(current_volume);
            - script.execute: update_volume_leds


# ============================================================
# Rotary encoder button: 
#   Single Click: Play/Pause
#   Double Click: Next Track
# ============================================================

binary_sensor:
  - platform: gpio
    name: "Rotary Button"
  
    pin:
      number: ${rotary_pin_button}
      mode:
        input: true
        pullup: true
      inverted: true
  
    filters:
      - delayed_on_off: 20ms
        
    on_multi_click:
    - timing:
        - ON for at most 1s
        - OFF for at most 1s
        - ON for at most 1s
        - OFF for at least 0.2s
      then:
        - media_player.next:
            id: external_media_player
        - logger.log: "Double-Clicked"
    - timing:
        - ON for at most 1s
        - OFF for at least 0.5s
      then:
        - media_player.toggle:
            id: external_media_player
        - logger.log: "Single-Clicked"

sensor:
- platform: rotary_encoder
  name: "Rotary Encoder"
  pin_a: ${rotary_pin_b}
  pin_b: ${rotary_pin_a}
  on_clockwise:
    - lambda: |-
        float new_vol = id(current_volume) + 0.05f;
        if (new_vol > 1.0f) 
          new_vol = 1.0f;
        id(current_volume) = new_vol;
    - media_player.volume_set:
        id: external_media_player
        volume: !lambda "return id(current_volume);"

  on_anticlockwise:
    - lambda: |-
        float new_vol = id(current_volume) - 0.05f;
        if (new_vol < 0.0f)
          new_vol = 0.0f;
        id(current_volume) = new_vol;
    - media_player.volume_set:
        id: external_media_player
        volume: !lambda "return id(current_volume);"
        
# ===== Packages =====
packages:
  esparagus_remote:
    url: https://github.com/sonocotta/esp32-audio-dock
    ref: main
    files:
      # Option A: TAS58xx configured with ganged 15-band EQ
      - firmware/esphome/packages/dac-tas58xx.yaml
      # Option B: TAS58xx configured with individual 15-band EQ per channel
      # - firmware/esphome/packages/dac-tas58xx-biamp.yaml
      # Option C: TAS58xx configured with bi-amp mode, with filters applied to both channels (HF or LF)
      # - firmware/esphome/packages/dac-tas58xx-presets.yaml

      - firmware/esphome/packages/audio.yaml
      - firmware/esphome/packages/sendspin-no-light.yaml
      # Optional: OLED displays clock when idling, and track/artist info when playing
